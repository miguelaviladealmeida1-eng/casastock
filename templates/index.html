<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CasaStock — Estoque doméstico</title><link rel="stylesheet" href="/static/style.css"></head>
<body><aside><h2>⌂ Casa<span>Stock</span></h2><p>GESTÃO DOMÉSTICA</p><nav><button data-status="">Visão geral</button><button data-status="low">Estoque baixo</button><button data-status="out">Em falta</button></nav><small>EXPO TECH • Sistema local</small></aside>
<main><header><div><small>PAINEL DOMÉSTICO</small><h1>Seu estoque sob controle.</h1><p>Acompanhe os produtos da sua casa em um só lugar.</p></div><button id="add">＋ Adicionar produto</button></header>
<section class="stats"><article><small>Total de produtos</small><b id="total">0</b></article><article><small>Unidades em estoque</small><b id="units">0</b></article><article><small>Estoque baixo</small><b id="low">0</b></article><article><small>Em falta</small><b id="out">0</b></article></section>
<section class="panel"><div class="tools"><h2>Produtos da casa</h2><input id="search" placeholder="Buscar produto..."><select id="category"><option>Todas</option>{% for c in categories %}<option>{{c}}</option>{% endfor %}</select><button id="csv">Exportar CSV</button></div>
<div class="tablewrap"><table><thead><tr><th>PRODUTO</th><th>CATEGORIA</th><th>QUANTIDADE</th><th>SITUAÇÃO</th><th>AÇÕES</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<dialog id="modal"><form id="form"><h2 id="formtitle">Adicionar produto</h2><label>Nome<input name="name" required maxlength="80"></label><label>Categoria<select name="category">{% for c in categories %}<option>{{c}}</option>{% endfor %}</select></label><div class="two"><label>Quantidade<input name="quantity" type="number" min="0" value="0" required></label><label>Estoque mínimo<input name="min_quantity" type="number" min="0" value="2" required></label></div><label>Unidade<input name="unit" value="un."></label><div class="actions"><button type="button" id="cancel">Cancelar</button><button type="submit">Salvar produto</button></div></form></dialog><div id="toast"></div><script src="/static/app.js"></script></body></html>
